<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OneSo · Temp Root</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="hero-glow" aria-hidden="true"></div>
      <div class="hero-main">
        <p class="eyebrow">OneIMS · PC Temp Root</p>
        <h1 class="brand">OneSo</h1>
      </div>
      <div class="hero-meta">
        <div class="hero-controls">
          <div class="chip chip-muted" id="adbChip">adb · …</div>
          <div class="chip chip-muted" id="soChip">so · …</div>
          <div class="chip chip-muted" id="versionChip">temp-root only</div>
        </div>
      </div>
    </header>

    <main class="workspace">
      <section class="home-hero" aria-label="启动页">
        <div class="home-hero-art" aria-hidden="true">
          <div class="orbit orbit-a"></div>
          <div class="orbit orbit-b"></div>
          <div class="orb"></div>
          <div class="beam"></div>
          <div class="art-label">READY ORBIT</div>
        </div>
        <div class="home-hero-copy">
          <p class="home-kicker">ONESO · 一键临时 Root</p>
          <h2 class="home-title">只在这里跑<br/>PC 临时 Root</h2>
          <p class="home-desc">
            so 生成 / 打包已全部放到 GitHub（OneSo-assets）。
            本窗口只做：体检 → 预览 → 确认执行。默认不会自动跑长任务。
          </p>
          <div class="home-actions">
            <button type="button" class="btn primary" id="btnBoot">开始体检</button>
            <button type="button" class="btn ghost" id="btnTempDry" disabled>预览计划</button>
            <button type="button" class="btn danger" id="btnTempRun" disabled>一键临时 Root</button>
          </div>
          <div class="check-panel">
            <p class="check-summary is-scan" id="checkSummary">尚未扫描。点「开始体检」。</p>
            <ul class="check-list" id="checkList"></ul>
          </div>
          <div class="log-panel" id="logPanel">OneSo TempRoot desk · so factory → GitHub</div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>so 工厂在 GitHub · 本地只跑 TempRoot</span>
      <span id="footerMeta">single window</span>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
